name: Try to Create OCI VM
# 每 5 分钟尝试一次
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  OCI_CLI_REGION: "ap-tokyo-1"
  OCI_CLI_USER: ${{ secrets.OCI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        continue-on-error: true
        run: |
          set -o pipefail
          pip install oci-cli
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=ap-tokyo-1" >> ~/.oci/config

          # ⚠️ 这里必须换成你自己的 SSH 公钥！
          echo "ssh-rsa  ssh-key-2026-09-02" > /home/runner/my_ssh_key.pub

          # 使用填在 Secrets 里的子网 ID
          SUBNET_ID="${{ secrets.OCI_SUBNET_ID }}"
          echo "使用的子网 ID: $SUBNET_ID"

          # 自动寻找当前区域最新的 Ubuntu 22.04 ARM 镜像
          echo "正在寻找 Ubuntu 22.04 ARM 镜像..."
          IMAGE_ID=$(oci compute image list --compartment-id "${{ secrets.OCI_TENANCY }}" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED --query "data[0].id" --raw-output 2>&1 || true)
          echo "找到的镜像 ID: $IMAGE_ID"

          # 执行创建命令（标准免费额度 2 OCPU / 12 GB）
          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "${{ secrets.OCI_TENANCY }}" \
            --availability-domain "AP-TOKYO-1-AD-1" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "ubuntu-vm" \
            --boot-volume-size-in-gbs 100 2>&1 || true)

          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "Success! 'PROVISIONING' state found in output."
            exit 0
          else
            echo "Error: Success string not found in OCI output. Failing the step."
            exit 1
          fi
